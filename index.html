<style>
:root{--bg:#0f1424;--pn:#1e2639;--or:#e9a23b;--tx:#f2f4fa;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}

.b:active{transform:scale(.97)}

input{width:min(70vw,200px);padding:12px;border-radius:10px;border:2px solid #39455f;background:#121829;color:#fff;font:700 18px inherit;text-align:center;text-transform:uppercase}

#menu .sn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;border:0;border-radius:12px;background:#0009;color:#fff;font-size:18px;padding:8px 12px}#info{text-align:center;font-size:13px}#nome{text-transform:none;width:min(86vw,360px);box-sizing:border-box}
